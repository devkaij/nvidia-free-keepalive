name: nvidia-free Space Keep-Alive

on:
  schedule:
    # 每 10 分钟(UTC)。GitHub cron 最小粒度 5 分钟,高峰期实测会延迟 5~15 分钟;
    # 创空间是「请求闲置」型休眠(有人访问即保持/唤醒),10 分钟足够。
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手动触发(测试用)

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STUDIO_API: https://www.modelscope.cn/api/v1/studio/A177593/nvidia-free-proxy
      API_HEALTH: https://studio-a177593-nvidia-free-proxy.api-inference.modelscope.net/healthz
    steps:
      - name: ① 实例域名健康检查(api-inference;真实例 ping)
        shell: bash
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          # 2026-10-18 实测:ms.show 独立域名已被平台全球 403(引导去 api-inference),
          # 匿名心跳路已断;api-inference 需账号 token,国内 IP 实测 200,GH 出口(美国)
          # 是否可达未知——通了就是真实例 ping(保活),不通只 warning 不阻断(判据靠 ②)。
          if [ -z "$MS_TOKEN" ]; then
            echo "未配置 MODELSCOPE_TOKEN secret,实例 ping 跳过(建议配置,见仓库 README)"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            -A 'Mozilla/5.0' \
            -H "Authorization: Bearer $MS_TOKEN" "$API_HEALTH" || echo FAIL)
          echo "→ $API_HEALTH  HTTP $CODE"
          [ "$CODE" = "200" ] || echo "::warning::GH 出口打不通实例域名(只影响本路 ping,判据以 ② 为准)"

      - name: ② 校验实例真实状态(权威判据:HTTP 200 不是判据,SPA 恒 200)
        shell: bash
        run: |
          R=$(curl -s -o /tmp/studio.json -w '%{http_code}' --max-time 25 -A 'Mozilla/5.0' "$STUDIO_API" || echo FAIL)
          if [ "$R" = "200" ]; then
            S=$(grep -o '"Status":"[^"]*"' /tmp/studio.json | head -n1 | cut -d'"' -f4)
            echo "✅ Data.Status=$S"
            # 非 Running 仅 warning:若 ① 通了则请求本身会唤醒,下一拍复核;不扰民
            [ "$S" = "Running" ] || echo "::warning::Status=$S 非 Running(若 ① 未通,等国内主路唤醒)"
          else
            echo "::error::状态查询失败(HTTP $R)"; exit 1
          fi
